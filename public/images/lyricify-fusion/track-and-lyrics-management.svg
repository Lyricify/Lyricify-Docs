<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">曲目与歌词管理操作区域示意</title>
  <desc id="desc">全部曲目窗口从左到右分为曲目列表、歌词源列表和版本详情与歌词预览。先选歌曲，再选版本，最后检查并设置使用方式。</desc>
  <rect width="960" height="330" rx="16" fill="#f3f7f5"/>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" fill="#173d2b">
    <text x="28" y="38" font-size="20" font-weight="700">全部曲目 · 操作区域示意</text>
    <text x="28" y="63" font-size="14" fill="#52665b">选择曲目 → 选择歌词版本 → 预览并设置使用方式</text>
    <g fill="#ffffff" stroke="#cadbd1">
      <rect x="24" y="84" width="208" height="222" rx="10"/>
      <rect x="246" y="84" width="236" height="222" rx="10"/>
      <rect x="496" y="84" width="440" height="222" rx="10"/>
    </g>
    <g fill="#087b3c">
      <circle cx="48" cy="111" r="13"/><circle cx="270" cy="111" r="13"/><circle cx="520" cy="111" r="13"/>
    </g>
    <g fill="#ffffff" font-size="14" text-anchor="middle" font-weight="700">
      <text x="48" y="116">1</text><text x="270" y="116">2</text><text x="520" y="116">3</text>
    </g>
    <g font-size="17" font-weight="700">
      <text x="70" y="117">曲目</text><text x="292" y="117">歌词源</text><text x="542" y="117">版本详情与歌词预览</text>
    </g>
    <g font-size="14" fill="#52665b">
      <text x="40" y="152">搜索 · 筛选 · 排序</text>
      <text x="40" y="213">其他已保存的歌曲</text>
      <text x="262" y="207">其他在线词源</text>
      <text x="262" y="238">本地歌词</text>
      <text x="512" y="150">核对歌名、艺人和版本</text>
    </g>
    <rect x="36" y="165" width="184" height="30" rx="6" fill="#e3f2e9"/>
    <text x="46" y="185" font-size="14">所选曲目</text>
    <rect x="258" y="151" width="212" height="30" rx="6" fill="#e3f2e9"/>
    <text x="268" y="171" font-size="14">选中的在线歌词版本</text>
    <rect x="258" y="263" width="100" height="28" rx="6" fill="#edf2ef"/>
    <text x="274" y="282" font-size="14">添加歌词</text>
    <g font-size="14">
      <rect x="512" y="164" width="96" height="30" rx="6" fill="#087b3c"/>
      <text x="526" y="184" fill="#ffffff">固定使用</text>
      <rect x="617" y="164" width="96" height="30" rx="6" fill="#edf2ef"/>
      <text x="631" y="184">更换版本</text>
      <text x="729" y="184" fill="#52665b">更多 ···</text>
      <text x="512" y="224">歌词正文与翻译</text>
      <text x="512" y="251" fill="#52665b">查看内容与“效果预览”</text>
      <text x="512" y="282" fill="#52665b">预览和保存不会固定版本</text>
    </g>
  </g>
</svg>
